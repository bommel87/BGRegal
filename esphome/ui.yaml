# UI: Auswahl -> Vorschlag -> Ja/Nein -> Standort + Start -> Sitzung (Runde, am Zug) -> Beenden.
# Der Zustand kommt komplett aus Home Assistant, das Display selbst merkt sich nichts.
#
# Layout für das runde 466x466-Display: Mittelpunkt (233, 233), Radius 233.
# Alle Elemente sind von der Mitte aus positioniert (align: CENTER + x/y) und so bemessen,
# dass ihre Ecken im Kreis liegen. Schwarzer Hintergrund: schwarze Pixel sind auf AMOLED aus.

# Entity-IDs von BGRegal (fest, sprachunabhängig); bei Bedarf im Gerät überschreiben
substitutions:
  suggestion_entity: sensor.bgregal_vorschlag
  session_entity: sensor.bgregal_sitzung

font:
  - file: "gfonts://Roboto"
    id: roboto_28
    size: 28
    glyphs: &glyphs "!\"#%&'()+,-./0123456789:?ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyzäöüÄÖÜß|·"
  - file: "gfonts://Roboto"
    id: roboto_20
    size: 20
    glyphs: *glyphs
  - file: "gfonts://Roboto"
    id: roboto_48
    size: 48
    glyphs: *glyphs

script:
  # Welche Seite gezeigt wird, hängt von Sitzung UND Vorschlag ab
  - id: show_page
    then:
      - if:
          condition:
            lambda: 'return id(ha_session).state == "running";'
          then:
            - lvgl.page.show: page_running
          else:
            - if:
                condition:
                  lambda: 'return id(ha_session).state == "finished";'
                then:
                  - lvgl.page.show: page_finished
                else:
                  - if:
                      condition:
                        lambda: 'return id(ha_phase).state == "suggested";'
                      then:
                        - lvgl.page.show: page_suggest
                      else:
                        - if:
                            condition:
                              lambda: 'return id(ha_phase).state == "accepted";'
                            then:
                              - lvgl.page.show: page_accepted
                            else:
                              - if:
                                  condition:
                                    lambda: 'return id(ha_phase).state == "none";'
                                  then:
                                    - lvgl.page.show: page_none
                                  else:
                                    - lvgl.page.show: page_select

text_sensor:
  # --- Vorschlag ---
  - platform: homeassistant
    id: ha_phase
    entity_id: ${suggestion_entity}
    on_value:
      then:
        - script.execute: show_page

  - platform: homeassistant
    id: ha_name
    entity_id: ${suggestion_entity}
    attribute: name
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_sug_name
            text: !lambda 'return x;'
        - lvgl.label.update:
            id: lbl_acc_name
            text: !lambda 'return x;'

  - platform: homeassistant
    id: ha_summary
    entity_id: ${suggestion_entity}
    attribute: summary
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_sug_summary
            text: !lambda 'return x;'

  - platform: homeassistant
    id: ha_location
    entity_id: ${suggestion_entity}
    attribute: location
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_acc_location
            text: !lambda 'return x.empty() ? std::string("Kein Standort hinterlegt") : x;'

  # --- Sitzung ---
  - platform: homeassistant
    id: ha_session
    entity_id: ${session_entity}
    on_value:
      then:
        - script.execute: show_page

  - platform: homeassistant
    id: ha_session_name
    entity_id: ${session_entity}
    attribute: name
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_run_name
            text: !lambda 'return x;'
        - lvgl.label.update:
            id: lbl_fin_name
            text: !lambda 'return x;'

  - platform: homeassistant
    id: ha_round
    entity_id: ${session_entity}
    attribute: round
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_run_round
            text: !lambda 'return "Runde " + x;'

  - platform: homeassistant
    id: ha_current
    entity_id: ${session_entity}
    attribute: current_player
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_run_player
            text: !lambda 'return x.empty() ? std::string("") : "Am Zug: " + x;'

lvgl:
  default_font: roboto_28
  displays:
    - main_display
  touchscreens:
    - main_touch
  bg_color: 0x000000
  text_color: 0xFFFFFF
  style_definitions:
    - id: pill
      radius: 30
    - id: muted
      text_font: roboto_20
      text_color: 0xA0A0A0
  theme:
    roller:
      bg_color: 0x1E1E1E
      text_color: 0xFFFFFF
      border_width: 0
      text_font: roboto_20
  pages:
    # ------------------------------------------------------------ Auswahl
    - id: page_select
      bg_color: 0x000000
      widgets:
        - label:
            text: "Was spielen wir?"
            align: CENTER
            y: -170
        - label:
            text: "Modus"
            styles: muted
            align: CENTER
            x: -136
            y: -62
        - label:
            text: "Typ"
            styles: muted
            align: CENTER
            y: -62
        - label:
            text: "Spieler"
            styles: muted
            align: CENTER
            x: 136
            y: -62
        - roller:
            id: roller_mode
            options: ["Egal", "Koop", "Wettkampf"]
            visible_row_count: 3
            width: 130
            align: CENTER
            x: -136
            y: 20
        - roller:
            id: roller_type
            options: ["Egal", "Familie", "Strategie", "Party", "Abstrakt", "Thematisch", "Kriegsspiel", "Kinder"]
            visible_row_count: 3
            width: 130
            align: CENTER
            y: 20
        - roller:
            id: roller_players
            options: ["1", "2", "3", "4", "5", "6", "7", "8"]
            selected_index: 3
            visible_row_count: 3
            width: 130
            align: CENTER
            x: 136
            y: 20
        - button:
            styles: pill
            width: 240
            height: 60
            align: CENTER
            y: 130
            widgets:
              - label:
                  text: "Vorschlag"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgregal.suggest
                  data_template:
                    mode: "{{ mode }}"
                    game_type: "{{ gtype }}"
                    players: "{{ players }}"
                  variables:
                    mode: !lambda |-
                      static const char *v[] = {"any", "cooperative", "competitive"};
                      return std::string(v[id(roller_mode)->get_selected_index()]);
                    gtype: !lambda |-
                      static const char *v[] = {"any", "family", "strategy", "party",
                                                "abstract", "thematic", "wargame", "children"};
                      return std::string(v[id(roller_type)->get_selected_index()]);
                    players: !lambda |-
                      return std::to_string(id(roller_players)->get_selected_index() + 1);

    # ------------------------------------------------------------ Vorschlag
    - id: page_suggest
      bg_color: 0x000000
      widgets:
        - label:
            text: "Wie wäre es mit"
            styles: muted
            align: CENTER
            y: -150
        - label:
            id: lbl_sug_name
            text: "-"
            width: 330
            long_mode: WRAP
            text_align: CENTER
            align: CENTER
            y: -60
        - label:
            id: lbl_sug_summary
            text: ""
            styles: muted
            width: 330
            long_mode: WRAP
            text_align: CENTER
            align: CENTER
            y: 40
        - button:
            styles: pill
            bg_color: 0x444444
            width: 150
            height: 60
            align: CENTER
            x: -82
            y: 130
            widgets:
              - label:
                  text: "Nein"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgregal.reject_suggestion
        - button:
            styles: pill
            bg_color: 0x2E7D32
            width: 150
            height: 60
            align: CENTER
            x: 82
            y: 130
            widgets:
              - label:
                  text: "Ja"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgregal.accept_suggestion

    # ------------------------------------------------------------ Angenommen
    - id: page_accepted
      bg_color: 0x000000
      widgets:
        - label:
            id: lbl_acc_name
            text: "-"
            width: 300
            long_mode: WRAP
            text_align: CENTER
            align: CENTER
            y: -120
        - label:
            text: "Standort"
            styles: muted
            align: CENTER
            y: -40
        - label:
            id: lbl_acc_location
            text: ""
            width: 330
            long_mode: WRAP
            text_align: CENTER
            align: CENTER
            y: 10
        - button:
            styles: pill
            bg_color: 0x444444
            width: 150
            height: 60
            align: CENTER
            x: -82
            y: 130
            widgets:
              - label:
                  text: "Zurück"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgregal.reset_suggestion
        - button:
            styles: pill
            bg_color: 0x2E7D32
            width: 150
            height: 60
            align: CENTER
            x: 82
            y: 130
            widgets:
              - label:
                  text: "Start"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgregal.start_session

    # ------------------------------------------------------------ Kein Treffer
    - id: page_none
      bg_color: 0x000000
      widgets:
        - label:
            text: "Keine (weiteren) Spiele gefunden"
            width: 320
            long_mode: WRAP
            text_align: CENTER
            align: CENTER
            y: -30
        - button:
            styles: pill
            width: 240
            height: 60
            align: CENTER
            y: 130
            widgets:
              - label:
                  text: "Neu wählen"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgregal.reset_suggestion

    # ------------------------------------------------------------ Sitzung läuft (Spielhilfe)
    - id: page_running
      bg_color: 0x000000
      widgets:
        - label:
            id: lbl_run_name
            text: "-"
            styles: muted
            width: 300
            long_mode: DOT
            text_align: CENTER
            align: CENTER
            y: -165
        - label:
            id: lbl_run_round
            text: "Runde 1"
            text_font: roboto_48
            align: CENTER
            y: -95
        - label:
            id: lbl_run_player
            text: ""
            width: 360
            long_mode: DOT
            text_align: CENTER
            align: CENTER
            y: -35
        - button:
            styles: pill
            bg_color: 0x2E7D32
            width: 200
            height: 64
            align: CENTER
            x: -105
            y: 50
            widgets:
              - label:
                  text: "Nächster"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgregal.next_player
        - button:
            styles: pill
            bg_color: 0x1565C0
            width: 200
            height: 64
            align: CENTER
            x: 105
            y: 50
            widgets:
              - label:
                  text: "Runde +"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgregal.next_round
        - button:
            styles: pill
            bg_color: 0xC62828
            width: 220
            height: 60
            align: CENTER
            y: 145
            widgets:
              - label:
                  text: "Beenden"
                  align: CENTER
            on_click:
              - homeassistant.action:
                  action: bgregal.end_session

    # ------------------------------------------------------------ Sitzung beendet
    - id: page_finished
      bg_color: 0x000000
      widgets:
        - label:
            id: lbl_fin_name
            text: "-"
            width: 320
            long_mode: WRAP
            text_align: CENTER
            align: CENTER
            y: -90
        - label:
            text: "Partie beendet. Punkte und QR-Code für BG Stats im BGRegal-Panel."
            styles: muted
            width: 330
            long_mode: WRAP
            text_align: CENTER
            align: CENTER
            y: 10
