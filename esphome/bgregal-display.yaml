# ESPHome: BGRegal-Display (Waveshare ESP32-S3 Touch AMOLED 1.75") – Variante mit lokalen Dateien
# Spielvorschlag -> annehmen -> Standort -> Sitzung mit Spielhilfe -> Beenden.
#
# Für den ESPHome Device Builder in Home Assistant ist bgregal-display-ha.yaml einfacher:
# Sie lädt alles direkt aus GitHub und braucht keine weiteren Dateien.
#
# Benötigt ESPHome >= 2025.7 (homeassistant.action). In Home Assistant beim ESPHome-Gerät
# „Dem Gerät erlauben, Home-Assistant-Aktionen auszuführen“ aktivieren.

substitutions:
  name: bgregal-display
  friendly_name: BGRegal Display

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  board: !include board.yaml
  hardware: !include hardware_waveshare_amoled.yaml
  ui: !include ui.yaml
