sync_now:

set_game:
  fields:
    bgg_id: &bgg_id
      example: 13
      selector:
        number:
          min: 1
          max: 99999999
          mode: box
    name: &name
      example: Catan
      selector:
        text:
    shelf:
      example: Regal 2
      selector:
        text:
    compartment:
      example: 3
      selector:
        number:
          min: 0
          max: 50
          mode: box
    in_base:
      selector:
        boolean:
    in_box:
      example: 13
      selector:
        number:
          min: 0
          max: 999999999
          mode: box
    nfc_tag:
      selector:
        text:
    light_profile:
      example: scene.spieleabend
      selector:
        entity:
          domain:
            - scene
            - script
    playlist:
      example: https://open.spotify.com/playlist/...
      selector:
        text:
    manual_url:
      selector:
        text:
          type: url
    links:
      example: '[{"title": "Errata", "url": "https://example.com/errata.pdf"}]'
      selector:
        object:
    ean:
      example: "4002051693602"
      selector:
        text:

scan_code:
  fields:
    code:
      required: true
      example: "4002051693602"
      selector:
        text:

set_shelf:
  fields:
    name:
      required: true
      example: Regal 1
      selector:
        text:
    new_name:
      selector:
        text:
    area_id:
      selector:
        area:
    compartments:
      selector:
        number:
          min: 0
          max: 50
          mode: box
    compartment_1_bottom:
      selector:
        boolean:
    game_sort:
      selector:
        select:
          translation_key: game_sort
          options:
            - name
            - plays
            - last_play
            - manual

set_sort_order:
  fields:
    kind:
      required: true
      selector:
        select:
          translation_key: sort_kind
          options:
            - rooms
            - shelves
            - games
    order:
      required: true
      example: '["Regal 1", "Regal 2"]'
      selector:
        text:
          multiple: true

remove_shelf:
  fields:
    name:
      required: true
      selector:
        text:

assign_scanned_tag:
  fields:
    bgg_id: *bgg_id
    name: *name

lend_game:
  fields:
    bgg_id: *bgg_id
    name: *name
    borrower:
      required: true
      example: Ben
      selector:
        text:

return_game:
  fields:
    bgg_id: *bgg_id
    name: *name

start_session:
  fields:
    bgg_id: *bgg_id
    name: *name
    order: &names
      example: '["Anna", "Ben"]'
      selector:
        text:
          multiple: true

end_session:

cancel_session:

next_player:

next_round:

set_order:
  fields:
    order:
      required: true
      example: '["Anna", "Ben"]'
      selector:
        text:
          multiple: true

finish_session:
  fields:
    players:
      required: true
      example: '[{"name": "Anna", "score": 42}, {"name": "Ben", "score": 38}]'
      selector:
        object:
    note:
      selector:
        text:
          multiline: true
    auto_winner:
      default: true
      selector:
        boolean:

session_qr:

suggest:
  fields:
    players:
      selector:
        number:
          min: 1
          max: 20
          mode: box
    mode:
      default: any
      selector:
        select:
          translation_key: mode
          options:
            - any
            - cooperative
            - competitive
    game_type:
      default: any
      selector:
        select:
          translation_key: game_type
          options:
            - any
            - family
            - strategy
            - party
            - abstract
            - thematic
            - wargame
            - children
    max_playtime:
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: min
          mode: box
    attendees: *names

reject_suggestion:

accept_suggestion:

reset_suggestion:

set_player:
  fields:
    name:
      required: true
      selector:
        text:
    bgg_username:
      selector:
        text:
    dislikes:
      selector:
        select:
          multiple: true
          translation_key: dislike
          options:
            - cooperative
            - competitive
            - family
            - strategy
            - party
            - abstract
            - thematic
            - wargame
            - children
    hidden:
      selector:
        boolean:

remove_player:
  fields:
    name:
      required: true
      selector:
        text:

plan_evening:
  fields:
    title:
      example: Spieleabend
      selector:
        text:
    start:
      required: true
      selector:
        datetime:
    guests: *names
    max_playtime:
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: min
          mode: box
    candidates: &ids
      example: "[13, 822]"
      selector:
        object:
    base_url: &base_url
      example: https://ha.example.com:8123
      selector:
        text:
          type: url

set_candidates:
  fields:
    evening_id: &evening_id
      required: true
      selector:
        number:
          min: 1
          max: 999999
          mode: box
    candidates:
      required: true
      example: "[13, 822]"
      selector:
        object:

remove_evening:
  fields:
    evening_id: *evening_id

vote:
  fields:
    evening_id: *evening_id
    voter:
      required: true
      selector:
        text:
    games:
      required: true
      example: "[13, 822]"
      selector:
        object:

evening_qr:
  fields:
    evening_id: *evening_id
    base_url: *base_url

dismiss_expansions:

start_inventory:
  fields:
    shelf:
      required: true
      example: Regal 1
      selector:
        text:
    compartment:
      default: 1
      selector:
        number:
          min: 1
          max: 50
          mode: box

inventory_place:
  fields:
    bgg_id: *bgg_id
    name: *name

inventory_undo:

inventory_next:
  fields:
    clear_missing: &clear_missing
      default: false
      selector:
        boolean:
    compartment:
      selector:
        number:
          min: 1
          max: 50
          mode: box

stop_inventory:
  fields:
    clear_missing: *clear_missing
