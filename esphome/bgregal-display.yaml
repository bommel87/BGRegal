# ESPHome: BGRegal-Display (Waveshare ESP32-S3 Touch AMOLED 1.75")
# Spielvorschlag -> annehmen -> Standort -> Sitzung mit Spielhilfe -> Beenden.
#
# Benötigt ESPHome >= 2025.7 (homeassistant.action). In Home Assistant beim ESPHome-Gerät
# „Dem Gerät erlauben, Home-Assistant-Aktionen auszuführen“ aktivieren.
# Die Entity-IDs von BGRegal sind fest (sensor.bgregal_vorschlag, sensor.bgregal_sitzung),
# deshalb muss hier nichts angepasst werden außer den Zugangsdaten in secrets.yaml.

substitutions:
  name: bgregal-display
  friendly_name: BGRegal Display
  suggestion_entity: sensor.bgregal_vorschlag
  session_entity: sensor.bgregal_sitzung

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  hardware: !include hardware_waveshare_amoled.yaml
  ui: !include ui.yaml
